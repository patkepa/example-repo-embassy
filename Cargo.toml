[package]
name = "example-repo-embassy"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "example-repo-embassy"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
esp-backtrace = { version = "=0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c6"] }
esp-hal = { version = "=1.1.1", features = ["esp32c6", "unstable"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32c6", "jtag-serial", "critical-section"] }
esp-rtos = { version = "=0.3.0", features = ["esp32c6", "embassy"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

